# Derive the gigos-* / gigpkgs-* channel branches from the trunk.
#
# Each channel branch is the trunk with ONE marker file rewritten (channel.nix)
# and the lock refreshed to match it (flake.lock). This workflow, on every push
# to the trunk, gates on a bare-minimum `nix flake check`, then for each channel
# overwrites channel.nix, relocks, and force-pushes to the derived branch. No
# source drift, no merge maintenance — the branches are pure projections.
#
# Two branch families are derived from the same channels so downstream consumers
# can pin whichever name they prefer:
#   gigos-<channel>    (legacy name)
#   gigpkgs-<channel>  (repo-matching name)
# Both in a family point at the same base nixpkgs channel.
#
# Triggers on both `main` and `master` so the planned trunk rename
# (main -> master, per gigpkgs#14) needs no flag-day change here.
name: channels

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Bare-minimum gate: the trunk must evaluate before we derive channels from it.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: flake check (eval gate)
        run: nix flake check --no-build --accept-flake-config

  derive:
    needs: check
    # Project onto channel branches on a real trunk push, or a manual dispatch
    # (so the derive can be tested on demand). NEVER on PRs — we don't derive
    # channel branches from unmerged code.
    if: >-
      (github.event_name == 'push'
        && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: gigos-unstable
            channel: nixos-unstable
          - branch: gigos-26.05
            channel: nixos-2605
          - branch: gigpkgs-unstable
            channel: nixos-unstable
          - branch: gigpkgs-26.05
            channel: nixos-2605
          # gigos-stable / gigpkgs-stable are NOT plain derives — stable is a
          # gated promotion (Hydra, gigpkgs#17). Intentionally excluded here.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Project trunk onto ${{ matrix.branch }} (channel=${{ matrix.channel }})
        run: |
          set -euo pipefail
          git config user.name  "gigpkgs-bot"
          git config user.email "gigpkgs-bot@users.noreply.github.com"

          # Overwrite ONLY the marker; everything else is identical to the trunk.
          {
            printf '# CI-derived from %s (%s) — do not edit.\n' "${{ github.ref_name }}" "${{ github.sha }}"
            printf '# Regenerated on every push to the trunk by .github/workflows/channels.yml\n'
            printf '"%s"\n' "${{ matrix.channel }}"
          } > channel.nix

          # Relock so the derived branch carries a flake.lock consistent with its
          # channel marker. `nix flake lock` only adds missing or changed entries
          # (e.g. flake=false roll-flow siblings the trunk lock may not yet
          # carry); when the trunk lock is already complete this is a no-op, so
          # the projection stays a pure marker delta.
          nix flake lock --accept-flake-config

          git add channel.nix flake.lock
          git commit -m "derive(${{ matrix.branch }}): channel=${{ matrix.channel }} @ ${{ github.sha }}"
          git push --force-with-lease origin "HEAD:refs/heads/${{ matrix.branch }}"
